server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos de la SPA (React + Babylon.js)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Matchmaker de Colyseus
    location /matchmake {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket de Colyseus para tiempo real (Salas /island, /lobby, etc.)
    location ~* ^/(island|lobby|colyseus|ws) {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Healthcheck del servidor
    location /health {
        proxy_pass http://127.0.0.1:2567/health;
        proxy_http_version 1.1;
    }

    # Cache de assets 3D
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|glb|gltf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
