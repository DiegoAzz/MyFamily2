services:
  # 1. Cliente Web (Nginx + React + Babylon.js 3D)
  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 2. Servidor de Juego en Tiempo Real (Colyseus WebSocket)
  game-server:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.server
    restart: unless-stopped
    ports:
      - "${GAME_SERVER_PORT:-2567}:2567"
    environment:
      - NODE_ENV=production
      - PORT=2567
      - DATABASE_URL=${DATABASE_URL}
      - MAX_PLAYERS_PER_ROOM=${MAX_PLAYERS_PER_ROOM:-16}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:2567/health"]
      interval: 10s
      timeout: 4s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  # 3. API REST Backend (Auth, Cuentas, Mundos)
  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Base de Datos Relacional PostgreSQL
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wildborn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildborn_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-wildborn_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wildborn} -d ${POSTGRES_DB:-wildborn_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
